<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLED Attribute Remover</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 12px;
        font-family: Arial, sans-serif;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }

      h2 {
        margin: 18px 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #555;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        height: 32px;
        padding: 0 8px;
        box-sizing: border-box;
      }

      button {
        height: 32px;
        border: 1px solid #bbb;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
        max-height: 160px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px;
        border-bottom: 1px solid #eee;
      }

      li:last-child {
        border-bottom: 0;
      }

      .site {
        flex: 1;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        word-break: break-all;
      }

      .site.disabled {
        color: #999;
        text-decoration: line-through;
      }

      li button {
        height: 26px;
        font-size: 12px;
        padding: 0 8px;
      }

      .footer {
        margin-top: 12px;
      }

      .footer button {
        width: 100%;
      }

      #status {
        margin-top: 8px;
        min-height: 18px;
        font-size: 12px;
        color: #006400;
      }
    </style>
  </head>
  <body>
    <h1>OLED Attribute Remover</h1>

    <h2>Attribute removal</h2>
    <div class="row">
      <input id="siteInput" type="text" placeholder="example.com or *.example.com" />
      <button id="addButton" type="button">Add</button>
    </div>
    <ul id="sitesList"></ul>

    <h2>Style overrides</h2>
    <ul id="rulesList"></ul>
    <div class="footer">
      <button id="presetButton" type="button" hidden></button>
    </div>

    <div class="footer">
      <button id="optionsButton" type="button">Edit style overrides</button>
    </div>
    <div id="status"></div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
