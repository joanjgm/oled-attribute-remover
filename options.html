<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLED Attribute Remover - Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        max-width: 760px;
      }

      h1 {
        margin-top: 0;
        font-size: 22px;
      }

      p {
        margin: 6px 0 14px;
      }

      textarea {
        width: 100%;
        min-height: 260px;
        font-family: Consolas, "Courier New", monospace;
        font-size: 14px;
        padding: 10px;
        box-sizing: border-box;
      }

      button {
        margin-top: 12px;
        padding: 8px 14px;
        cursor: pointer;
      }

      #status {
        margin-left: 10px;
        color: #006400;
      }
    </style>
  </head>
  <body>
    <h1>Enabled websites</h1>
    <p>Write one entry per line. Valid examples:</p>
    <p><code>example.com</code> · <code>*.example.com</code> · <code>*://example.com/*</code></p>
    <textarea id="sites" placeholder="example.com&#10;*.mydomain.com"></textarea>
    <br />
    <button id="save">Save</button>
    <span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
